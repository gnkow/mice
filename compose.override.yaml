# Dev-only: auto-loaded by `docker compose up`. Production runs `docker compose -f compose.yaml up`.
services:
  auth:
    # Podman aardvark-dns (10.89.0.1) often returns EAI_AGAIN for registry.npmjs.org
    # while still resolving compose service names. Forwarding via public resolvers
    # unblocks in-container `npm install` without breaking postgres/keycloak DNS.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Playwright mintSession + synthetic mice-e2e issuer (opaque sealed sessions).
      AUTH_DEV_MODE: "true"
      # __Host- cookies need Secure+HTTPS; local UI is http://localhost.
      SESSION_COOKIE_NAME: mice_session
      # Instance admins only. `mice_user` / `partner` are seeded as `user`, not admin.
      AUTHZ_BOOTSTRAP_ADMINS: ${AUTHZ_BOOTSTRAP_ADMINS:-mice_admin@mice.com}

  web:
    dns:
      - 8.8.8.8
      - 1.1.1.1

  oxen-server:
    ports:
      # Published for e2e setup helpers (OXEN_URL). Browser traffic must use the BFF.
      - "${OXEN_PORT:-3001}:3001"
  # Published on localhost so unit tests on the host use the same databases as the BFF.
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  immudb:
    ports:
      - "127.0.0.1:${IMMUDB_PORT:-3322}:3322"
  novu-api:
    ports:
      - "127.0.0.1:${NOVU_PORT:-3010}:3000"
