# Composable Oxen stack for Mice.
# Full stack: docker compose up --build
#
# Browser → web (Vite) → auth (Hono BFF) → oxen-server
# Keycloak provides OIDC locally. Point OIDC_* at another IdP to replace it.

name: mice

services:
  oxen-server:
    image: oxen/oxen-server:latest
    # INVARIANT: no host port. oxen has no auth, so only the BFF (same compose network) may reach it;
    # an unaudited mutation must have no path around the BFF. Dev publishes it via compose.override.yaml.
    volumes:
      - oxen-data:/var/oxen/data
    environment:
      SYNC_DIR: /var/oxen/data
    restart: unless-stopped
    networks:
      - mice

  # Main relational data (ADR 0004). No host port here; compose.override.yaml publishes it on localhost for dev and tests.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mice
      POSTGRES_USER: mice
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mice -d mice"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - mice

  # Audit trail (ADR 0005). The admin password is loaded from an env file; immudb has no *_FILE variable.
  immudb:
    image: codenotary/immudb:1.9.5
    # No arm64 build of this tag; the newer arm64 image has no binary to health-check with.
    platform: linux/amd64
    env_file:
      - ${IMMUDB_ENV_PATH:-./.secrets/immudb.env}
    volumes:
      - immudb-data:/var/lib/immudb
    healthcheck:
      test: ["CMD", "/usr/local/bin/immuadmin", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - mice

  # Notifications (ADR 0004). Novu owns messages and read state; the BFF is its only client.
  novu-mongodb:
    image: mongo:8.0.17
    env_file:
      - ${NOVU_ENV_PATH:-./.secrets/novu.env}
    volumes:
      - novu-mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - mice

  novu-redis:
    image: redis:7-alpine
    env_file:
      - ${NOVU_ENV_PATH:-./.secrets/novu.env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - novu-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - mice

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.19.0
    env_file:
      - ${NOVU_ENV_PATH:-./.secrets/novu.env}
    environment: &novu-env
      NODE_ENV: production
      PORT: "3000"
      API_ROOT_URL: http://novu-api:3000
      FRONT_BASE_URL: http://localhost:4000
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      REDIS_DB_INDEX: "2"
      MONGO_AUTO_CREATE_INDEXES: "true"
      IS_SELF_HOSTED: "true"
      IS_V2_ENABLED: "true"
      IS_API_IDEMPOTENCY_ENABLED: "true"
      DISABLE_USER_REGISTRATION: "false"
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - mice

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.19.0
    env_file:
      - ${NOVU_ENV_PATH:-./.secrets/novu.env}
    environment:
      <<: *novu-env
      PORT: "3004"
      API_ROOT_URL: http://novu-api:3000
    depends_on:
      novu-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mice

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./auth/keycloak/realm-mice.json:/opt/keycloak/data/import/realm-mice.json:ro
      - ./auth/keycloak/realm-partner-saml.json:/opt/keycloak/data/import/realm-partner-saml.json:ro
    networks:
      - mice

  auth:
    build:
      context: ./auth
      target: dev
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      OXEN_UPSTREAM: http://oxen-server:3001
      AUTH_DATA_DIR: /data
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      IMMUDB_HOST: immudb
      IMMUDB_PASSWORD_FILE: /run/secrets/immudb_password
      NOVU_URL: http://novu-api:3000
      NOVU_PASSWORD_FILE: /run/secrets/novu_password
      PUBLIC_OXEN_REMOTE: http://localhost:${AUTH_PORT:-8080}
      PUBLIC_WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-mice-session-secret}
      # Ed25519 PKCS#8 PEM (\n-escaped). Regenerate with `node auth/scripts/gen-audit-export-key.mjs`; file the public key in IQP.
      AUDIT_EXPORT_PRIVATE_KEY: "${AUDIT_EXPORT_PRIVATE_KEY:------BEGIN PRIVATE KEY-----\\nMC4CAQAwBQYDK2VwBCIEIDDE/V5/+dMDU6prQ/All5QDlKSRFkfLiWLoBurtp1ou\\n-----END PRIVATE KEY-----\\n}"
      SESSION_IDLE_SEC: ${SESSION_IDLE_SEC:-900}
      AUTHZ_BOOTSTRAP_ADMINS: ${AUTHZ_BOOTSTRAP_ADMINS:-mice_admin@mice.com,mice_mfa@mice.com}
      AUTHZ_REQUIRE_TRAINING: ${AUTHZ_REQUIRE_TRAINING:-false}
      # Server-side discovery inside Compose (override all OIDC_* for another IdP)
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/mice}
      # Browser-facing issuer / authorize host
      OIDC_ISSUER_PUBLIC: ${OIDC_ISSUER_PUBLIC:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/mice}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-mice-auth}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-mice-auth-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:${WEB_PORT:-5173}/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:${WEB_PORT:-5173}/login}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      # Directory search via Keycloak Admin API (service account on mice-auth)
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mice}
      DIRECTORY_PROVIDER: ${DIRECTORY_PROVIDER:-keycloak}
      COOKIE_SECURE: "false"
      # Corporate TLS intercepts break npm inside the image; prefer host node_modules.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      # PLAT-JOB — host path required so `docker run -v` can mount job workdirs
      # (Docker Desktop cannot mount paths that only exist inside auth_data).
      JOBS_DATA_DIR: /data/jobs
      # Prefer absolute path from `make up` / `make reset` (see Makefile).
      JOBS_HOST_DATA_DIR: ${JOBS_HOST_DATA_DIR:-./.data/jobs}
      JOBS_RUNNER: ${JOBS_RUNNER:-docker}
      JOBS_DOCKER_SOCKET: /var/run/docker.sock
      JOBS_IMAGE_PULL_ALLOWLIST: ${JOBS_IMAGE_PULL_ALLOWLIST:-}
      JOBS_MAX_CONCURRENT: ${JOBS_MAX_CONCURRENT:-2}
      # PLAT-SESS — desktop sessions (local Docker provisioner + guacamole-lite)
      SESSIONS_ENABLED: ${SESSIONS_ENABLED:-true}
      SESSIONS_DATA_DIR: /data/sessions
      SESSIONS_HOST_DATA_DIR: ${SESSIONS_HOST_DATA_DIR:-./.data/sessions}
      # Default docker = real XFCE+xrdp guests. Use mock for fast e2e only.
      SESSIONS_PROVISIONER: ${SESSIONS_PROVISIONER:-docker}
      SESSIONS_DOCKER_SOCKET: /var/run/docker.sock
      SESSIONS_DOCKER_NETWORK: ${SESSIONS_DOCKER_NETWORK:-mice_mice}
      SESSIONS_DESKTOP_IMAGE: ${SESSIONS_DESKTOP_IMAGE:-lscr.io/linuxserver/rdesktop:ubuntu-xfce}
      SESSIONS_MAX_PER_USER: ${SESSIONS_MAX_PER_USER:-2}
      SESSIONS_IDLE_TIMEOUT_SECONDS: ${SESSIONS_IDLE_TIMEOUT_SECONDS:-14400}
      SESSIONS_MAX_LIFETIME_SECONDS: ${SESSIONS_MAX_LIFETIME_SECONDS:-43200}
      SESSIONS_CONNECT_BACKEND: ${SESSIONS_CONNECT_BACKEND:-guacamole_lite}
      SESSIONS_GUACD_HOST: guacd
      SESSIONS_GUACD_PORT: "4822"
      SESSIONS_RUSTGUAC_URL: ${SESSIONS_RUSTGUAC_URL:-}
      SESSIONS_RUSTGUAC_API_KEY: ${SESSIONS_RUSTGUAC_API_KEY:-}
      SESSIONS_RECORDING: ${SESSIONS_RECORDING:-false}
      SESSIONS_AUDIT_RETENTION_DAYS: ${SESSIONS_AUDIT_RETENTION_DAYS:-365}
      WORKSPACES_UID: ${WORKSPACES_UID:-1000}
      WORKSPACES_GID: ${WORKSPACES_GID:-1000}
    volumes:
      - ./auth:/app
      - auth_node_modules:/app/node_modules
      - auth_data:/data
      # Mice workspaces: shared per-commit checkout store + overlay upper/work dirs.
      - mice-store:/data/store
      - mice-workspaces:/data/workspaces
      # Bind-mount so host Docker can re-bind job workdirs into runner containers.
      - ${JOBS_HOST_DATA_DIR:-./.data/jobs}:/data/jobs
      - ${SESSIONS_HOST_DATA_DIR:-./.data/sessions}:/data/sessions
      # Local (Docker) runner. Set JOBS_RUNNER=kubernetes for Cluster jobs.
      - ${JOBS_DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
    secrets:
      - postgres_password
      - immudb_password
      - novu_password
    depends_on:
      oxen-server:
        condition: service_started
      keycloak:
        condition: service_started
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
      immudb:
        condition: service_healthy
      novu-api:
        condition: service_healthy
    networks:
      - mice

  # Guacamole daemon — RDP/VNC protocol translation for Sessions Connect
  # Keep in step with web's guacamole-common-js (^1.5); 1.6 guacd + 1.5 JS
  # triggers "Guacamole protocol violation". disable-gfx exists since 1.5.
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - mice

  # Optional rustguac (set SESSIONS_CONNECT_BACKEND=rustguac + SESSIONS_RUSTGUAC_URL)
  rustguac:
    profiles: ["rustguac"]
    image: ${RUSTGUAC_IMAGE:-ghcr.io/sol1/rustguac:latest}
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
    depends_on:
      - guacd
    networks:
      - mice

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Browser calls same-origin /api and /auth; Vite proxies to the BFF.
      AUTH_PROXY_TARGET: http://auth:8080
      WEB_PORT: ${WEB_PORT:-5173}
      # Oxen CLI remote shown in Clone box (BFF, not raw oxen-server).
      VITE_OXEN_REMOTE: http://localhost:${AUTH_PORT:-8080}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - auth
    networks:
      - mice

networks:
  mice:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_PATH:-./.secrets/postgres-password}
  immudb_password:
    file: ${IMMUDB_PASSWORD_PATH:-./.secrets/immudb-password}
  novu_password:
    file: ${NOVU_PASSWORD_PATH:-./.secrets/novu-password}

volumes:
  postgres-data:
  immudb-data:
  novu-mongodb:
  novu-redis:
  oxen-data:
  web_node_modules:
  auth_node_modules:
  auth_data:
  mice-store:
    name: ${WORKSPACES_STORE_VOLUME:-mice-store}
  mice-workspaces:
    name: ${WORKSPACES_VOLUME:-mice-workspaces}
