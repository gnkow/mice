# Composable Oxen stack for Boxen.
# Full stack: docker compose up --build

name: boxen

services:
  oxen-server:
    image: oxen/oxen-server:latest
    ports:
      - "${OXEN_PORT:-3001}:3001"
    volumes:
      - oxen-data:/var/oxen/data
    environment:
      SYNC_DIR: /var/oxen/data
    restart: unless-stopped
    networks:
      - boxen

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Browser calls same-origin /api; Vite proxies to the compose service name.
      OXEN_PROXY_TARGET: http://oxen-server:3001
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - oxen-server
    networks:
      - boxen

networks:
  boxen:

volumes:
  oxen-data:
  web_node_modules:
