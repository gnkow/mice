# Composable Oxen stack for Mice.
# Full stack: docker compose up --build
#
# Browser → web (Vite) → auth (Hono BFF) → oxen-server
# Keycloak provides OIDC locally. Point OIDC_* at another IdP to replace it.

name: mice

services:
  oxen-server:
    image: oxen/oxen-server:latest
    ports:
      # Published for e2e setup helpers (OXEN_URL). Browser traffic must use the BFF.
      - "${OXEN_PORT:-3001}:3001"
    volumes:
      - oxen-data:/var/oxen/data
    environment:
      SYNC_DIR: /var/oxen/data
    restart: unless-stopped
    networks:
      - mice

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./auth/keycloak/realm-mice.json:/opt/keycloak/data/import/realm-mice.json:ro
    networks:
      - mice

  auth:
    build:
      context: ./auth
      target: dev
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      OXEN_UPSTREAM: http://oxen-server:3001
      AUTH_DATA_DIR: /data
      PUBLIC_OXEN_REMOTE: http://localhost:${AUTH_PORT:-8080}
      PUBLIC_WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      # Optional notification delivery (inbox/toasts work without these).
      NOTIFICATIONS_SMTP_URL: ${NOTIFICATIONS_SMTP_URL:-}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-}
      NOTIFICATIONS_VAPID_PUBLIC_KEY: ${NOTIFICATIONS_VAPID_PUBLIC_KEY:-}
      NOTIFICATIONS_VAPID_PRIVATE_KEY: ${NOTIFICATIONS_VAPID_PRIVATE_KEY:-}
      NOTIFICATIONS_VAPID_SUBJECT: ${NOTIFICATIONS_VAPID_SUBJECT:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-mice-session-secret}
      # PLAT-AUTHO: unset = store flag (off until bootstrap).
      AUTHZ_ENFORCE: ${AUTHZ_ENFORCE:-}
      AUTHZ_BOOTSTRAP_ADMINS: ${AUTHZ_BOOTSTRAP_ADMINS:-mice@example.com}
      AUTHZ_DEV_GRANT_ALL: ${AUTHZ_DEV_GRANT_ALL:-true}
      AUTHZ_GROUP_BOOTSTRAP: ${AUTHZ_GROUP_BOOTSTRAP:-}
      AUTHZ_REQUIRE_TRAINING: ${AUTHZ_REQUIRE_TRAINING:-false}
      # Server-side discovery inside Compose (override all OIDC_* for another IdP)
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/mice}
      # Browser-facing issuer / authorize host
      OIDC_ISSUER_PUBLIC: ${OIDC_ISSUER_PUBLIC:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/mice}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-mice-auth}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-mice-auth-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:${WEB_PORT:-5173}/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:${WEB_PORT:-5173}/login}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      # Directory search via Keycloak Admin API (service account on mice-auth)
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mice}
      DIRECTORY_PROVIDER: ${DIRECTORY_PROVIDER:-keycloak}
      COOKIE_SECURE: "false"
      # Corporate TLS intercepts break npm inside the image; prefer host node_modules.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      # PLAT-JOB — host path required so `docker run -v` can mount job workdirs
      # (Docker Desktop cannot mount paths that only exist inside auth_data).
      JOBS_DATA_DIR: /data/jobs
      # Prefer absolute path from `make up` / `make reset` (see Makefile).
      JOBS_HOST_DATA_DIR: ${JOBS_HOST_DATA_DIR:-./.data/jobs}
      JOBS_RUNNER: ${JOBS_RUNNER:-docker}
      JOBS_DOCKER_SOCKET: /var/run/docker.sock
      JOBS_IMAGE_PULL_ALLOWLIST: ${JOBS_IMAGE_PULL_ALLOWLIST:-}
      JOBS_MAX_CONCURRENT: ${JOBS_MAX_CONCURRENT:-2}
      # PLAT-SESS — desktop sessions (local Docker provisioner + guacamole-lite)
      SESSIONS_ENABLED: ${SESSIONS_ENABLED:-true}
      SESSIONS_DATA_DIR: /data/sessions
      SESSIONS_HOST_DATA_DIR: ${SESSIONS_HOST_DATA_DIR:-./.data/sessions}
      # Default docker = real XFCE+xrdp guests. Use mock for fast e2e only.
      SESSIONS_PROVISIONER: ${SESSIONS_PROVISIONER:-docker}
      SESSIONS_DOCKER_SOCKET: /var/run/docker.sock
      SESSIONS_DOCKER_NETWORK: ${SESSIONS_DOCKER_NETWORK:-mice_mice}
      SESSIONS_DESKTOP_IMAGE: ${SESSIONS_DESKTOP_IMAGE:-lscr.io/linuxserver/rdesktop:ubuntu-xfce}
      SESSIONS_MAX_PER_USER: ${SESSIONS_MAX_PER_USER:-2}
      SESSIONS_IDLE_TIMEOUT_SECONDS: ${SESSIONS_IDLE_TIMEOUT_SECONDS:-14400}
      SESSIONS_MAX_LIFETIME_SECONDS: ${SESSIONS_MAX_LIFETIME_SECONDS:-43200}
      SESSIONS_CONNECT_BACKEND: ${SESSIONS_CONNECT_BACKEND:-guacamole_lite}
      SESSIONS_GUACD_HOST: guacd
      SESSIONS_GUACD_PORT: "4822"
      SESSIONS_RUSTGUAC_URL: ${SESSIONS_RUSTGUAC_URL:-}
      SESSIONS_RUSTGUAC_API_KEY: ${SESSIONS_RUSTGUAC_API_KEY:-}
      SESSIONS_RECORDING: ${SESSIONS_RECORDING:-false}
      SESSIONS_AUDIT_RETENTION_DAYS: ${SESSIONS_AUDIT_RETENTION_DAYS:-365}
      WORKSPACES_UID: ${WORKSPACES_UID:-1000}
      WORKSPACES_GID: ${WORKSPACES_GID:-1000}
    volumes:
      - ./auth:/app
      - auth_node_modules:/app/node_modules
      - auth_data:/data
      # Mice workspaces: shared per-commit checkout store + overlay upper/work dirs.
      - mice-store:/data/store
      - mice-workspaces:/data/workspaces
      # Bind-mount so host Docker can re-bind job workdirs into runner containers.
      - ${JOBS_HOST_DATA_DIR:-./.data/jobs}:/data/jobs
      - ${SESSIONS_HOST_DATA_DIR:-./.data/sessions}:/data/sessions
      # Local (Docker) runner. Set JOBS_RUNNER=kubernetes for Cluster jobs.
      - ${JOBS_DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - oxen-server
      - keycloak
      - guacd
    networks:
      - mice

  # Guacamole daemon — RDP/VNC protocol translation for Sessions Connect
  # Keep in step with web's guacamole-common-js (^1.5); 1.6 guacd + 1.5 JS
  # triggers "Guacamole protocol violation". disable-gfx exists since 1.5.
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - mice

  # Optional rustguac (set SESSIONS_CONNECT_BACKEND=rustguac + SESSIONS_RUSTGUAC_URL)
  rustguac:
    profiles: ["rustguac"]
    image: ${RUSTGUAC_IMAGE:-ghcr.io/sol1/rustguac:latest}
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
    depends_on:
      - guacd
    networks:
      - mice

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Browser calls same-origin /api and /auth; Vite proxies to the BFF.
      AUTH_PROXY_TARGET: http://auth:8080
      WEB_PORT: ${WEB_PORT:-5173}
      # Oxen CLI remote shown in Clone box (BFF, not raw oxen-server).
      VITE_OXEN_REMOTE: http://localhost:${AUTH_PORT:-8080}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - auth
    networks:
      - mice

networks:
  mice:

volumes:
  oxen-data:
  web_node_modules:
  auth_node_modules:
  auth_data:
  mice-store:
    name: ${WORKSPACES_STORE_VOLUME:-mice-store}
  mice-workspaces:
    name: ${WORKSPACES_VOLUME:-mice-workspaces}
